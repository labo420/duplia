openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product operations
  - name: admin
    description: Admin operations
  - name: ai
    description: AI-powered operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [Skincare, Makeup, Haircare, Bodycare, Fragrance]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /matches:
    get:
      operationId: listMatches
      tags: [products]
      summary: List all product matches
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [Skincare, Makeup, Haircare, Bodycare, Fragrance]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of product match pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductMatch"
  /matches/{matchId}:
    get:
      operationId: getMatch
      tags: [products]
      summary: Get a specific product match by match ID
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product match detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductMatch"
        "404":
          description: Match not found
  /categories/summary:
    get:
      operationId: getCategorySummary
      tags: [products]
      summary: Get product counts per category
      responses:
        "200":
          description: Category summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategorySummary"
  /trending:
    get:
      operationId: getTrending
      tags: [products]
      summary: Get trending matches
      responses:
        "200":
          description: Trending matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductMatch"
  /ai/suggestions:
    get:
      operationId: getAiSuggestions
      tags: [ai]
      summary: Autocomplete suggestions for luxury products
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: List of matching luxury product suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiSuggestion"
  /ai/search:
    post:
      operationId: aiSearch
      tags: [ai]
      summary: AI-powered product search — finds a luxury product and generates 1-3 dupes by tier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSearchBody"
      responses:
        "200":
          description: AI search result with luxury product and 3 tier dupes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSearchResult"
        "404":
          description: Product not found by AI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSearchNotFound"
        "500":
          description: AI service error
  /admin/products:
    get:
      operationId: adminListProducts
      tags: [admin]
      summary: List all products (admin)
      parameters:
        - name: x-admin-password
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          description: Unauthorized
    post:
      operationId: adminCreateProduct
      tags: [admin]
      summary: Create a new product (admin)
      parameters:
        - name: x-admin-password
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
  /admin/products/{id}:
    delete:
      operationId: adminDeleteProduct
      tags: [admin]
      summary: Delete a product (admin)
      parameters:
        - name: x-admin-password
          in: header
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        brand:
          type: string
        price:
          type: number
          format: float
        imageUrl:
          type: string
        affiliateLink:
          type: string
        category:
          type: string
          enum: [Skincare, Makeup, Haircare, Bodycare, Fragrance]
        type:
          type: string
          enum: [Luxury, Dupe]
        matchId:
          type: integer
        matchScore:
          type: integer
        formato:
          type: ["number", "null"]
          format: float
        unitaMisura:
          type: ["string", "null"]
        pricePerUnit:
          type: ["number", "null"]
          format: float
        dupeTier:
          type: ["string", "null"]
          enum: [budget, mid-range, premium-dupe, null]
        luxuryGroupId:
          type: ["integer", "null"]
        aiMatchReason:
          type: ["string", "null"]
      required:
        - id
        - name
        - brand
        - price
        - imageUrl
        - affiliateLink
        - category
        - type
        - matchId
        - matchScore
        - formato
        - unitaMisura
        - pricePerUnit
        - dupeTier
        - luxuryGroupId
        - aiMatchReason
    ProductMatch:
      type: object
      properties:
        matchId:
          type: integer
        category:
          type: string
        luxury:
          $ref: "#/components/schemas/Product"
        dupe:
          $ref: "#/components/schemas/Product"
        matchScore:
          type: integer
        priceDifference:
          type: number
          format: float
        savingsPercent:
          type: number
          format: float
      required:
        - matchId
        - category
        - luxury
        - dupe
        - matchScore
        - priceDifference
        - savingsPercent
    CategorySummary:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required:
        - category
        - count
    AiSuggestion:
      type: object
      properties:
        brand:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [Skincare, Makeup, Haircare, Bodycare, Fragrance]
        isFromCache:
          type: boolean
      required:
        - brand
        - name
        - category
        - isFromCache
    AiSearchBody:
      type: object
      properties:
        query:
          type: string
      required:
        - query
    AiSearchResult:
      type: object
      properties:
        luxuryGroupId:
          type: integer
        luxury:
          $ref: "#/components/schemas/Product"
        dupes:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        lastAiCheckedAt:
          type: string
          format: date-time
        isFromCache:
          type: boolean
      required:
        - luxuryGroupId
        - luxury
        - dupes
        - lastAiCheckedAt
        - isFromCache
    AiSearchNotFound:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    CreateProductBody:
      type: object
      properties:
        name:
          type: string
        brand:
          type: string
        price:
          type: number
          format: float
        imageUrl:
          type: string
        affiliateLink:
          type: string
        category:
          type: string
          enum: [Skincare, Makeup, Haircare, Bodycare, Fragrance]
        type:
          type: string
          enum: [Luxury, Dupe]
        matchId:
          type: integer
        matchScore:
          type: integer
        formato:
          type: ["number", "null"]
          format: float
        unitaMisura:
          type: ["string", "null"]
      required:
        - name
        - brand
        - price
        - imageUrl
        - affiliateLink
        - category
        - type
        - matchId
        - matchScore
