kind = "web"
previewPath = "/"
title = "Dupefy"
version = "1.0.0"
id = "artifacts/dupefy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23328

[services.development]
run = "pnpm --filter @workspace/dupefy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dupefy", "run", "build" ]
publicDir = "artifacts/dupefy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23328"
BASE_PATH = "/"
